; WeaponProgression v0.18.4 release candidate configuration.
; Keep your existing config.ini when upgrading if you use custom values.
; Add any new sections you want from this example.

[Progression]
WeaponXPMultiplier=1.0
BaseLevelXP=100
XPIncreasePerLevel=50
MaxLevel=100

[StatUpgrades]
DamagePercent=2.0
CriticalChancePoints=1.0
CriticalMultiplierPoints=2.0
RPMPercent=2.0
FalloffPercent=2.0
PreventConsecutiveSameStat=true

; Caps apply to the TOTAL improvement above the captured base stat from both
; normal per-level rewards and milestone rewards. Percent caps are relative to
; captured base. Point caps are additive points above captured base.
[Caps]
DamagePercent=30
RPMPercent=25
FalloffPercent=25
CriticalChancePoints=15
CriticalMultiplierPoints=20

; Syntax:
; LevelN=Rank Name|BonusType|Value|OptionalFallbackBonusType
;
; Supported BonusType values in this build:
;   DamagePercent
;   FalloffPercent
;   RPMPercent
;   CriticalChancePoints
;   CriticalMultiplierPoints
;
; Set a milestone to Disabled to remove that configured level, e.g.:
; Level50=Disabled
;
; RPM milestones fall back to FalloffPercent on weapons that do not expose RPM.
; Rank and milestone bonuses are derived from the weapon's existing level, so
; old weapons automatically receive all applicable milestones on reconstruction.
[Milestones]
Enabled=true
Level5=Proven I|DamagePercent|2
Level10=Proven II|FalloffPercent|3
Level15=Proven III|CriticalMultiplierPoints|2
Level20=Trusted I|RPMPercent|3|FalloffPercent
Level25=Trusted II|CriticalChancePoints|1
Level30=Trusted III|DamagePercent|3
Level35=Veteran I|FalloffPercent|4
Level40=Veteran II|RPMPercent|4|FalloffPercent
Level45=Veteran III|CriticalMultiplierPoints|2
Level50=Elite I|DamagePercent|4
Level55=Elite II|CriticalChancePoints|2
Level60=Elite III|FalloffPercent|5
Level65=Signature I|RPMPercent|5|FalloffPercent
Level70=Signature II|DamagePercent|5
Level75=Signature III|CriticalMultiplierPoints|3

; Optional destination-level XP overrides. These are examples only; leave this
; section empty unless you want specific levels to use non-formula thresholds.
[LevelThresholds]
; Level5=250
; Level10=500

[Utility]
VerboseLogging=false

; Compatibility setting for the extra Level / XP / Kills / Rank rows that can
; be appended beneath the normal weapon tooltip.
; false (recommended/default): show progression bonuses in the normal stat rows
; and use F8 for the full progression view.
; true: experimental extra progression rows. Some UE4SS builds have shown native
; access-violation crashes while creating these additional tooltip widgets.
ShowProgressionTooltipRows=false

; Developer keys for Dave the gunsmith: F5 lowers and respawns him, F6
; respawns him, F7 removes him. Off by default so they cannot clash with other
; mods or games' keybinds. Takes effect on the next game/mod load.
DevControls=false

; User-facing mod text: en (English), ru (Russian), fr (French).
; Language=ru or Language=fr takes effect on the next game/mod load.
; Weapon names come from the game and custom milestone rank names in this file
; remain as written. Unsupported codes fall back to English.
[Localization]
Language=en

; ---------------------------------------------------------------------------
; Melee progression. Melee weapons level up from melee kills and are saved in
; melee.db, separately from firearms. Takes effect on the next game/mod load.
; ---------------------------------------------------------------------------
[Melee]
Enabled=true
WeaponXPMultiplier=1.0
BaseLevelXP=100
XPIncreasePerLevel=50
MaxLevel=50
PreventConsecutiveSameStat=true
; Lowest stamina cost per swing that upgrades can reach.
MinStaminaDrain=0.5

; One of these is rolled per melee level-up. StaminaDrainPercent LOWERS the
; stamina cost of each swing by that percentage.
[MeleeStatUpgrades]
MeleeDamagePercent=2.0
StaminaDrainPercent=3.0
CriticalChancePoints=1.0
CriticalMultiplierPoints=2.0

; Caps on the TOTAL change from the captured base (rolls + milestones).
; StaminaDrainPercent is the maximum reduction. AttackSpeedPercent caps the
; attack speed earned from AttackSpeedPercent milestones.
[MeleeCaps]
MeleeDamagePercent=30
StaminaDrainPercent=30
CriticalChancePoints=15
CriticalMultiplierPoints=20
AttackSpeedPercent=20

; Syntax: LevelN=Rank Name|BonusType|Value
; BonusType: MeleeDamagePercent, StaminaDrainPercent, CriticalChancePoints,
;            CriticalMultiplierPoints, AttackSpeedPercent
; AttackSpeedPercent speeds up the swing animation and shortens the delay
; between swings. It only comes from milestones.
[MeleeMilestones]
Enabled=true
Level5=Scrapper I|MeleeDamagePercent|2
Level10=Scrapper II|AttackSpeedPercent|5
Level15=Scrapper III|StaminaDrainPercent|5
Level20=Brawler I|CriticalChancePoints|1
Level25=Brawler II|AttackSpeedPercent|5
Level30=Brawler III|MeleeDamagePercent|3
Level35=Bruiser I|CriticalMultiplierPoints|2
Level40=Bruiser II|AttackSpeedPercent|5
Level45=Bruiser III|MeleeDamagePercent|4
Level50=Executioner|AttackSpeedPercent|5
