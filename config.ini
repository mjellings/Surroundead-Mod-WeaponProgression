; WeaponProgression v0.18.3 configuration
; Merge these sections into your existing config.ini if you already use custom values.

[Progression]
WeaponXPMultiplier=1.0
BaseLevelXP=100
XPIncreasePerLevel=50
MaxLevel=100

[StatUpgrades]
DamagePercent=2.0
CriticalChancePoints=1.0
CriticalMultiplierPoints=2.0
RPMPercent=2.0
FalloffPercent=2.0
PreventConsecutiveSameStat=true

; Caps apply to the TOTAL improvement above the captured base stat from both
; normal per-level rewards and milestone rewards. Percent caps are relative to
; captured base. Point caps are additive points above captured base.
[Caps]
DamagePercent=30
RPMPercent=25
FalloffPercent=25
CriticalChancePoints=15
CriticalMultiplierPoints=20

; Syntax:
; LevelN=Rank Name|BonusType|Value|OptionalFallbackBonusType
;
; Supported BonusType values in this build:
;   DamagePercent
;   FalloffPercent
;   RPMPercent
;   CriticalChancePoints
;   CriticalMultiplierPoints
;
; Set a milestone to Disabled to remove that configured level, e.g.:
; Level50=Disabled
;
; RPM milestones fall back to FalloffPercent on weapons that do not expose RPM.
; Rank and milestone bonuses are derived from the weapon's existing level, so
; old weapons automatically receive all applicable milestones on reconstruction.
[Milestones]
Enabled=true
Level5=Proven I|DamagePercent|2
Level10=Proven II|FalloffPercent|3
Level15=Proven III|CriticalMultiplierPoints|2
Level20=Trusted I|RPMPercent|3|FalloffPercent
Level25=Trusted II|CriticalChancePoints|1
Level30=Trusted III|DamagePercent|3
Level35=Veteran I|FalloffPercent|4
Level40=Veteran II|RPMPercent|4|FalloffPercent
Level45=Veteran III|CriticalMultiplierPoints|2
Level50=Elite I|DamagePercent|4
Level55=Elite II|CriticalChancePoints|2
Level60=Elite III|FalloffPercent|5
Level65=Signature I|RPMPercent|5|FalloffPercent
Level70=Signature II|DamagePercent|5
Level75=Signature III|CriticalMultiplierPoints|3

; Optional destination-level XP overrides. These are examples only; leave this
; section empty unless you want specific levels to use non-formula thresholds.
[LevelThresholds]
; Level5=250
; Level10=500

[Utility]
VerboseLogging=false

; Compatibility setting for the extra Level / XP / Kills / Rank rows that can
; be appended beneath the normal weapon tooltip.
; false (recommended/default): show progression bonuses in the normal stat rows
; and use F8 for the full progression view.
; true: experimental extra progression rows. Some UE4SS builds have shown native
; access-violation crashes while creating these additional tooltip widgets.
ShowProgressionTooltipRows=false
