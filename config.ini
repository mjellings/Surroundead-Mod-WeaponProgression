; WeaponProgression v0.17.0-dev1 configuration

[Progression]
WeaponXPMultiplier=4
BaseLevelXP=100
XPIncreasePerLevel=50
MaxLevel=100

[LevelThresholds]
; Optional destination-level overrides.
; For a quicker test you can temporarily uncomment:
; Level2=50
; Level3=50
;
; Otherwise the normal progression curve above is used.

[StatUpgrades]
; Percentage upgrades are calculated from the captured ORIGINAL base stat.
; e.g. two 2% Damage upgrades = base * 1.02^2
DamagePercent=2.0
CriticalChancePoints=1.0
CriticalMultiplierPoints=2.0
RPMPercent=2.0
FalloffPercent=2.0

; When the weapon has more than one eligible stat, don't roll the same
; stat on two consecutive level-ups.
PreventConsecutiveSameStat=true

[Caps]
; Maximum TOTAL progression bonus allowed above the captured original base.
; These caps apply to normal random level-up rewards + milestone bonuses combined.
DamagePercent=30
CriticalChancePoints=15
CriticalMultiplierPoints=20
RPMPercent=25
FalloffPercent=25

[Milestones]
Enabled=true

; Format:
; LevelX=Rank Name|BonusType|Value
;
; Optional fallback:
; LevelX=Rank Name|BonusType|Value|FallbackBonusType
;
; Supported Phase 1 bonus types:
; DamagePercent
; CriticalChancePoints
; CriticalMultiplierPoints
; RPMPercent
; FalloffPercent
;
; RPM milestones use FalloffPercent as a fallback for weapons
; that do not expose a FirearmRPM stat.

Level5=Proven I|DamagePercent|2
Level10=Proven II|FalloffPercent|3
Level15=Proven III|CriticalMultiplierPoints|2

Level20=Trusted I|RPMPercent|3|FalloffPercent
Level25=Trusted II|CriticalChancePoints|1
Level30=Trusted III|DamagePercent|3

Level35=Veteran I|FalloffPercent|4
Level40=Veteran II|RPMPercent|4|FalloffPercent
Level45=Veteran III|CriticalMultiplierPoints|2

Level50=Elite I|DamagePercent|4
Level55=Elite II|CriticalChancePoints|2
Level60=Elite III|FalloffPercent|5

Level65=Signature I|RPMPercent|5|FalloffPercent
Level70=Signature II|DamagePercent|5
Level75=Signature III|CriticalMultiplierPoints|3

